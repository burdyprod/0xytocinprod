<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="All the links for 0xytocin Productions in one place."
    />
    <meta name="theme-color" content="#171311" />
    <title>0xytocin — Links</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        --pink: #f48bb2;
        --paper: #f2e9e5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        background: #171311;
        color: var(--paper);
      }

      body::before,
      body::after {
        position: fixed;
        inset: -18px;
        content: "";
        pointer-events: none;
      }

      body::before {
        z-index: -2;
        background: url("./Pranburi%20Forest%200xytocin.jpg") center 48% / cover
          no-repeat;
        filter: blur(7px) brightness(0.4) saturate(0.62);
        transform: scale(1.04);
      }

      body::after {
        z-index: -1;
        background:
          linear-gradient(115deg, rgb(30 12 20 / 44%), transparent 58%),
          linear-gradient(180deg, rgb(10 8 9 / 16%), rgb(10 8 9 / 44%));
      }

      main {
        width: min(100% - 44px, 480px);
        padding: 34px 0 28px;
        margin: 28px 0;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 20px;
        color: var(--pink);
        font-family: "Courier New", monospace;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--pink);
        content: "";
        box-shadow: 0 0 12px rgb(244 139 178 / 60%);
      }

      h1 {
        margin: 0 0 10px -5px;
        color: var(--paper);
        font-family: Impact, "Arial Narrow", "Franklin Gothic Condensed", sans-serif;
        font-size: clamp(4.4rem, 18vw, 7.3rem);
        font-stretch: condensed;
        font-weight: 900;
        letter-spacing: -0.065em;
        line-height: 0.82;
        text-transform: uppercase;
      }

      .intro {
        margin: 22px 0 36px;
        color: rgb(242 233 229 / 76%);
        font-family: "Courier New", monospace;
        font-size: 0.8rem;
        letter-spacing: 0.015em;
      }

      .links {
        border-top: 1px solid rgb(242 233 229 / 35%);
      }

      .link-card {
        min-height: 78px;
        display: grid;
        grid-template-columns: 44px 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 12px 4px;
        border-bottom: 1px solid rgb(242 233 229 / 35%);
        color: inherit;
        text-decoration: none;
        transition: color 140ms ease, padding 140ms ease;
      }

      .link-card:hover {
        padding-right: 0;
        padding-left: 10px;
        color: var(--pink);
      }

      .link-card:focus-visible {
        outline: 2px solid var(--pink);
        outline-offset: 3px;
      }

      .icon {
        width: 21px;
        height: 21px;
        color: var(--pink);
      }

      .link-copy {
        min-width: 0;
        display: grid;
        gap: 5px;
      }

      .link-title {
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: -0.035em;
        text-transform: uppercase;
      }

      .link-detail {
        overflow: hidden;
        color: rgb(242 233 229 / 68%);
        font-family: "Courier New", monospace;
        font-size: 0.72rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .arrow {
        width: 16px;
        height: 16px;
        color: var(--pink);
      }

      footer {
        display: flex;
        justify-content: space-between;
        margin-top: 16px;
        color: rgb(242 233 229 / 65%);
        font-family: "Courier New", monospace;
        font-size: 0.64rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      @media (max-width: 420px) {
        main {
          width: min(100% - 40px, 480px);
        }

        h1 {
          font-size: clamp(4rem, 19vw, 5.2rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">0xytocin productions / link page</p>
      <h1>0xytocin</h1>
      <p class="intro">Find me elsewhere.</p>

      <nav class="links" aria-label="Social and contact links">
        <a
          class="link-card"
          href="https://www.youtube.com/@0xytocinproductions"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"
            />
          </svg>
          <span class="link-copy">
            <span class="link-title">YouTube</span>
            <span class="link-detail">@0xytocinproductions</span>
          </span>
          <svg class="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 17 17 7M8 7h9v9" stroke="currentColor" stroke-width="1.7" />
          </svg>
        </a>

        <a
          class="link-card"
          href="https://www.instagram.com/0xytocinprod/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4" />
            <circle cx="17.5" cy="6.8" r="1" fill="currentColor" stroke="none" />
          </svg>
          <span class="link-copy">
            <span class="link-title">Instagram</span>
            <span class="link-detail">@0xytocinprod</span>
          </span>
          <svg class="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 17 17 7M8 7h9v9" stroke="currentColor" stroke-width="1.7" />
          </svg>
        </a>

        <a class="link-card" href="mailto:0xyt0cinbiz@gmail.com">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            aria-hidden="true"
          >
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m4 7 8 6 8-6" />
          </svg>
          <span class="link-copy">
            <span class="link-title">Email</span>
            <span class="link-detail">0xyt0cinbiz@gmail.com</span>
          </span>
          <svg class="arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 17 17 7M8 7h9v9" stroke="currentColor" stroke-width="1.7" />
          </svg>
        </a>
      </nav>

      <footer><span>Independent / 0xytocin</span><span>Links 001—003</span></footer>
    </main>
  </body>
</html>
